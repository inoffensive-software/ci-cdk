deploy:
  stage: deploy
  needs:
    - prepare
    - job: build
      optional: true
      artifacts: false
    - job: test
      parallel:
        matrix:
          - GO_VERSION: "1.26"
            SHARD: 1
          - GO_VERSION: "1.27"
            SHARD: 2
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH
      changes:
        paths:
          - src/**/*
        compare_to: main
      exists:
        - Dockerfile
      when: manual
      allow_failure: true
      variables:
        DEPLOY: "true"
      needs:
        - build
  script: make deploy
