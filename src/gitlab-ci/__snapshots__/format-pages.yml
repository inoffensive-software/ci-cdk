stages:
  - build
  - deploy
pages:
  stage: deploy
  extends:
    - .pages-base
    - .setup
  needs:
    - build
    - job: test
      optional: true
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        paths:
          - public/**/*
        compare_to: main
      when: always
  tags:
    - pages
  image:
    name: node:24
    entrypoint:
      - ""
    pull_policy: if-not-present
  services:
    - docker:24.0.7-dind
  variables:
    PAGES_DIR: public
  cache:
    key:
      files:
        - package-lock.json
      prefix: pages-
    paths:
      - .npm
    policy: pull
    untracked: true
    when: on_success
    fallback_keys:
      - pages-main
  artifacts:
    paths:
      - public/
    exclude:
      - public/tmp/
    name: pages-$CI_COMMIT_SHA
    expire_in: 1 week
    expose_as: pages
    public: true
    when: always
    reports:
      junit: report.xml
  before_script:
    - npm ci
  script:
    - npm run build
  after_script: echo done
  environment:
    name: production
    url: $CI_PAGES_URL
    action: start
    on_stop: stop-pages
    auto_stop_in: 1 week
    deployment_tier: production
  release:
    tag_name: $CI_COMMIT_TAG
    description: Pages release
    name: pages-$CI_COMMIT_TAG
    ref: main
    milestones:
      - v1.0
    released_at: 2026-01-01T00:00:00Z
  trigger:
    project: group/child
    branch: main
    strategy: depend
  parallel:
    matrix:
      - BROWSER: chrome
  retry:
    max: 2
    when:
      - runner_system_failure
    exit_codes:
      - 137
  timeout: 1h
  interruptible: true
  allow_failure:
    exit_codes:
      - 1
  when: on_success
  resource_group: pages
  coverage: "/Coverage: \\d+\\.\\d+/"
build:
  stage: build
  script: make
