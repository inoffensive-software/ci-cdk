stages:
  - build
  - deploy
deploy:
  stage: deploy
  extends: .base
  needs:
    - build
    - job: test
      optional: true
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - changes:
        - ci/**/*
  tags:
    - docker
  image:
    name: alpine:3.20
    entrypoint:
      - ""
    pull_policy: always
  services:
    - name: postgres:16
      alias: db
  variables:
    DEPLOY: "true"
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go
    policy: push
  artifacts:
    paths:
      - dist/
    when: on_success
  before_script:
    - make deps
  script: make deploy
  after_script: echo done
  environment:
    name: production
    url: https://example.com
    action: start
    on_stop: stop-production
    auto_stop_in: 1 week
    deployment_tier: production
  release:
    tag_name: $CI_COMMIT_TAG
    description: Release $CI_COMMIT_TAG
    name: Release $CI_COMMIT_TAG
    ref: main
    milestones:
      - v1.0
    released_at: 2026-01-01T00:00:00Z
  trigger:
    project: group/downstream
    branch: main
    strategy: depend
    inputs:
      DEPLOY_ENV: staging
  parallel:
    matrix:
      - VERSION: "1.26"
        SHARD: 1
  retry:
    max: 2
    when:
      - runner_system_failure
    exit_codes:
      - 137
  timeout: 1h 30m
  interruptible: true
  allow_failure:
    exit_codes:
      - 1
      - 137
  when: on_success
  resource_group: deploy
  coverage: "/Coverage: \\d+\\.\\d+/"
