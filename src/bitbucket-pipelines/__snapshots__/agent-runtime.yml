definitions:
  agents:
    release-agent:
      config:
        overrides:
          model: claude-sonnet
          max-turns: 8
        path: agent/release.yml
      permissions:
        on-ask:
          allow:
            - read:repository
          default: deny
          deny:
            - write:repository
      prompt: Review the change and summarise the risk.
      provider: rovodev
      setup-script:
        - npm ci
        - pipe: atlassian/npm:1
          variables:
            NPM_TOKEN: ${NPM_TOKEN}
            FLAGS:
              - --quiet
              - --no-audit
      use-legacy-mcp: false
    audit-agent:
      permissions:
        on-ask: allow
      prompt: Audit the dependency tree.
      provider: claude
pipelines:
  default:
    - step:
        name: Agent review
        script:
          - npm ci
          - pipe: atlassian/npm:1
            variables:
              NPM_TOKEN: ${NPM_TOKEN}
          - agent: release-agent
            config:
              overrides:
                mode: strict
              path: agent/task.yml
            permissions:
              on-ask: deny
            prompt: Review only the changed files.
            provider: codex
            use-legacy-mcp: true
