definitions:
  steps:
    - step:
        name: deploy source to scratch org
        script:
          - pipe: atlassian/jenkins-job-trigger:0.10.0
            variables:
              JENKINS_URL: $JENKINS_URL
              JENKINS_USER: $JENKINS_USER
              JENKINS_TOKEN: $JENKINS_TOKEN
              JOB_NAME: $JENKINS_DEPLOYMENT_JOB
              JOB_PARAMETERS: "{\n  \"BRANCH\": \"$JENKINS_DEPLOYMENT_BRANCH\",\n  \"SFDX_URL\": \"$TARGET_ORG_SFDX_URL\",\n  \"RELEASE\": \"$JENKINS_DEPLOYMENT_RELEASE\"\n}\n"
              WAIT: "true"
              WAIT_MAX_TIME: "7000"
    - step:
        artifacts:
          - test-reports/**
        caches:
          - node
        name: run tests
        script:
          - export NODE_NO_WARNINGS=1
          - npm ci
          - npm run validation:check
          - npx playwright install --with-deps chromium
          - npm install -g @salesforce/cli@2.150.6
          - printf '%s\n' "$TARGET_ORG_SFDX_URL" | sf org login sfdx-url --set-default --no-prompt --sfdx-url-stdin
          - $RUN_TESTS_CLI_COMMAND
image: node:24.20.0-bookworm
pipelines:
  custom:
    1-salesforce-e2e-test-only:
      - variables:
          - description: SFDX URL for target org
            name: TARGET_ORG_SFDX_URL
          - default: npx playwright test --project=demo
            description: Run Playwright tests cli command
            name: RUN_TESTS_CLI_COMMAND
          - allowed-values:
              - "true"
              - "false"
            default: "false"
            description: enable Xray reporting
            name: XRAY_ENABLED
          - default: TA-11848
            description: Xray test plan key for reporting
            name: XRAY_TESTPLAN_KEY
          - allowed-values:
              - "true"
              - "false"
            default: "false"
            description: enable data storage cleanup
            name: STORAGE_CLEANUP_ENABLED
      - step:
          artifacts:
            - test-reports/**
          caches:
            - node
          name: run tests
          script:
            - export NODE_NO_WARNINGS=1
            - npm ci
            - npm run validation:check
            - npx playwright install --with-deps chromium
            - npm install -g @salesforce/cli@2.150.6
            - printf '%s\n' "$TARGET_ORG_SFDX_URL" | sf org login sfdx-url --set-default --no-prompt --sfdx-url-stdin
            - $RUN_TESTS_CLI_COMMAND
    2-salesforce-e2e-deploy-and-test:
      - variables:
          - description: SFDX URL for target org
            name: TARGET_ORG_SFDX_URL
          - allowed-values:
              - (V6) Deploy To Scratch Org
              - (DEV) Deploy To Scratch Org
            default: (DEV) Deploy To Scratch Org
            description: Jenkins deployment job name to run before tests
            name: JENKINS_DEPLOYMENT_JOB
          - default: origin/develop
            description: Branch to deploy
            name: JENKINS_DEPLOYMENT_BRANCH
          - default: develop
            description: Release to deploy
            name: JENKINS_DEPLOYMENT_RELEASE
          - default: npx playwright test --project=demo
            description: Run Playwright tests cli command
            name: RUN_TESTS_CLI_COMMAND
          - allowed-values:
              - "true"
              - "false"
            default: "false"
            description: enable Xray reporting
            name: XRAY_ENABLED
          - default: TA-11848
            description: Xray test plan key for reporting
            name: XRAY_TESTPLAN_KEY
          - allowed-values:
              - "true"
              - "false"
            default: "false"
            description: enable data storage cleanup
            name: STORAGE_CLEANUP_ENABLED
      - step:
          name: deploy source to scratch org
          script:
            - pipe: atlassian/jenkins-job-trigger:0.10.0
              variables:
                JENKINS_URL: $JENKINS_URL
                JENKINS_USER: $JENKINS_USER
                JENKINS_TOKEN: $JENKINS_TOKEN
                JOB_NAME: $JENKINS_DEPLOYMENT_JOB
                JOB_PARAMETERS: "{\n  \"BRANCH\": \"$JENKINS_DEPLOYMENT_BRANCH\",\n  \"SFDX_URL\": \"$TARGET_ORG_SFDX_URL\",\n  \"RELEASE\": \"$JENKINS_DEPLOYMENT_RELEASE\"\n}\n"
                WAIT: "true"
                WAIT_MAX_TIME: "7000"
      - step:
          artifacts:
            - test-reports/**
          caches:
            - node
          name: run tests
          script:
            - export NODE_NO_WARNINGS=1
            - npm ci
            - npm run validation:check
            - npx playwright install --with-deps chromium
            - npm install -g @salesforce/cli@2.150.6
            - printf '%s\n' "$TARGET_ORG_SFDX_URL" | sf org login sfdx-url --set-default --no-prompt --sfdx-url-stdin
            - $RUN_TESTS_CLI_COMMAND
    3-salesforce-e2e-scheduled-regression-tests:
      - variables:
          - default: TA-11848
            description: Xray test plan key for reporting
            name: XRAY_TESTPLAN_KEY
          - allowed-values:
              - "true"
              - "false"
            default: "false"
            description: enable data storage cleanup
            name: STORAGE_CLEANUP_ENABLED
      - step:
          name: deploy source to scratch org
          script:
            - pipe: atlassian/jenkins-job-trigger:0.10.0
              variables:
                JENKINS_URL: $JENKINS_URL
                JENKINS_USER: $JENKINS_USER
                JENKINS_TOKEN: $JENKINS_TOKEN
                JOB_NAME: $JENKINS_DEPLOYMENT_JOB
                JOB_PARAMETERS: "{\n  \"BRANCH\": \"$JENKINS_DEPLOYMENT_BRANCH\",\n  \"SFDX_URL\": \"$TARGET_ORG_SFDX_URL\",\n  \"RELEASE\": \"$JENKINS_DEPLOYMENT_RELEASE\"\n}\n"
                WAIT: "true"
                WAIT_MAX_TIME: "7000"
      - step:
          artifacts:
            - test-reports/**
          caches:
            - node
          name: run tests
          script:
            - export NODE_NO_WARNINGS=1
            - npm ci
            - npm run validation:check
            - npx playwright install --with-deps chromium
            - npm install -g @salesforce/cli@2.150.6
            - printf '%s\n' "$TARGET_ORG_SFDX_URL" | sf org login sfdx-url --set-default --no-prompt --sfdx-url-stdin
            - $RUN_TESTS_CLI_COMMAND
